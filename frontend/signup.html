<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Tailor — Create Account</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <span class="auth-brand">Resume Tailor</span>
      <h2>Create your account</h2>
      <p class="auth-sub">Start tailoring your resume with AI — free.</p>

      <form id="signup-form" novalidate>
        <label for="full-name">Full Name <span style="color:var(--muted-2);font-weight:400">(optional)</span></label>
        <input type="text" id="full-name" autocomplete="name" placeholder="Jane Smith" />

        <label for="email">Email address <span class="required">*</span></label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />

        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" required autocomplete="new-password" placeholder="Min 8 characters" minlength="8" />

        <label for="confirm">Confirm Password <span class="required">*</span></label>
        <input type="password" id="confirm" required autocomplete="new-password" placeholder="Repeat your password" />

        <button type="submit" class="btn btn-primary" id="submit-btn">Create Account</button>
        <p id="error-msg" class="error-msg" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in &rarr;</a>
      </div>
    </div>
  </main>
  <script src="js/signup.js"></script>
</body>
</html>
